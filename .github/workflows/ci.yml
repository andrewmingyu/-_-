name: Baseline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ANALYSIS_MODE: mock
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Source-only and credential check
        run: node scripts/check-commit.mjs
      - name: Install dependencies
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r backend/requirements.lock.txt
      - name: JavaScript tests
        run: npm test
      - name: TypeScript contracts
        run: npm run typecheck
      - name: Extension build
        run: npm run build
      - name: Python API and source tests
        run: python -m pytest -q
      - name: HTTP API smoke
        run: python scripts/smoke_backend.py
      - name: Chrome headless UI and events
        run: npm run test:browser
